paths: {}   # no path changes
components:
  schemas:
    # ADDITION: new value appended to the existing event-type enum (assumed name).
    # oasdiff may report this as an enum-value-added warning on payloads/responses.
    # It is non-breaking only if consumers are contractually tolerant readers (owner decision).
    NotificationEventType:
      x-delta-op: append-enum-values
      type: string
      enum:
        - account.reactivated

    # ADDITION: new discriminator mapping / oneOf branch on the existing envelope (assumed name).
    NotificationEvent:
      x-delta-op: add-oneOf-branch
      oneOf:
        - $ref: '#/components/schemas/AccountReactivatedEvent'
      discriminator:
        propertyName: eventType
        mapping:
          account.reactivated: '#/components/schemas/AccountReactivatedEvent'

    # ADDITION: new event schema
    AccountReactivatedEvent:
      type: object
      description: >
        Emitted once, after the transaction commits, when an account moves from suspended or
        deactivated back to active. Tenant-scoped. The producer sets tenantId from authenticated
        context.
      required: [eventId, eventType, occurredAt, tenantId, schemaVersion, data]
      properties:
        eventId:
          type: string
          format: uuid
          description: Unique per emission. Consumers deduplicate on this value.
        eventType:
          type: string
          const: account.reactivated
        occurredAt:
          type: string
          format: date-time
        tenantId:
          type: string
          description: Set by the producer from authenticated context. Never taken from caller input.
        schemaVersion:
          type: string
          example: "1"
        data:
          $ref: '#/components/schemas/AccountReactivatedData'
      additionalProperties: true

    AccountReactivatedData:
      type: object
      required: [accountId, reactivatedAt, previousStatus]
      properties:
        accountId:
          type: string
        reactivatedAt:
          type: string
          format: date-time
        previousStatus:
          type: string
          enum: [suspended, deactivated]
        reason:
          type: string
          maxLength: 512
          description: Optional operational reason. Must not contain PII.
        actor:
          type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [user, system, support]
            id:
              type: string
              description: Opaque actor identifier (not an email or name).
      additionalProperties: true
  examples:
