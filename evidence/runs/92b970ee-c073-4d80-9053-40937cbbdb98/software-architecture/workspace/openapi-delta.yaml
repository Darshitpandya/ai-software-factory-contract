webhooks:
  account.reactivated:
    post:
      operationId: onAccountReactivated
      summary: Delivered when a previously deactivated/suspended account is reactivated.
      description: |
        Additive webhook. Delivered only to subscriptions that belong to the event's tenant
        and have opted into `account.reactivated`. At-least-once delivery: consumers
        must deduplicate by `id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountReactivatedEvent'
            examples:
              reactivated:
                $ref: '#/components/examples/AccountReactivatedExample'
      responses:
        '2XX':
          description: Event accepted by subscriber.
        '4XX':
          description: Subscriber rejected the event. It won't be retried (except 408/429).
        '5XX':
          description: Subscriber error. Retried per the existing delivery policy.

components:
  schemas:
    # --- Additive change to existing enum (ASSUMED name) ---
    NotificationEventType:
      x-delta-operation: append-enum-value
      x-delta-note: Append only. Existing values are preserved unchanged.
      type: string
      enum:
        - account.reactivated

    # --- New schemas ---
    AccountReactivatedEvent:
      type: object
      description: Envelope for the account.reactivated event (mirrors the assumed NotificationEvent envelope).
      required: [id, type, occurred_at, tenant_id, data]
      properties:
        id:
          type: string
          format: uuid
          description: Unique event ID. Idempotency key for consumers.
        type:
          type: string
          const: account.reactivated
        occurred_at:
          type: string
          format: date-time
        tenant_id:
          type: string
          description: Owning tenant. Delivery is restricted to this tenant's subscriptions.
        data:
          $ref: '#/components/schemas/AccountReactivatedData'
      additionalProperties: true

    AccountReactivatedData:
      type: object
      required: [account_id, reactivated_at]
      properties:
        account_id:
          type: string
          description: Identifier of the reactivated account. No PII.
        reactivated_at:
          type: string
          format: date-time
        previous_status:
          type: string
          description: Status before reactivation (e.g. deactivated, suspended). Open string so future values aren't breaking.
        reason_code:
          type: string
          description: Optional machine-readable reason. Open string.
        actor_type:
          type: string
          enum: [user, admin, system]
          description: Category of the actor that triggered reactivation (no actor identity, to avoid PII).
      additionalProperties: true

  examples:
    AccountReactivatedExample:
      value:
        id: 3f6c1d2e-8a4b-4c9e-9f10-2b7d5e6a1c00
        type: account.reactivated
        occurred_at: '2025-01-15T10:00:00Z'
        tenant_id: tenant_example
        data:
          account_id: acct_example
          reactivated_at: '2025-01-15T10:00:00Z'
          previous_status: suspended
          reason_code: payment_resolved
          actor_type: system

