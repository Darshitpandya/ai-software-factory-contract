apiVersion: factory.contract/v1
kind: FactoryRelease

metadata:
  name: software-delivery
  version: "1.4.0"
  status: ACTIVE
  createdAt: "2026-01-01T00:00:00Z"

runtime:
  engine: claude-agent-sdk
  # ───────────────────────────────────────────────────────────────────────────
  # DEFAULT MODEL — applies to all stages unless overridden in stageModels below.
  #
  # Latest model: claude-opus-5-5 (released September 2026)
  #   For long-running agentic coding and knowledge work.
  #   Context window: 1M tokens | Max output: 128K tokens
  #   Price: $15/MTok input, $75/MTok output
  #   Retirement: not before September 22, 2027
  #
  # To change the model: update this value and the corresponding skills.lock.json
  # digest, then run the evaluation suite before promoting.
  # ───────────────────────────────────────────────────────────────────────────
  defaultModel: claude-opus-5-5
  sandbox:
    provider: opensandbox
    imageDigest: "sha256:1314fb30ec37592d5845e5a160d522c0e680972aa534549940b8d73bde88481a"
    resourceLimits:
      cpus: "2.0"
      memoryMb: 4096
      ttlSeconds: 3600
      networkEgress: restricted

productionLines:
  - product-requirements
  - software-architecture
  - software-engineering
  - security-compliance
  - platform-operations

# ─── PER-STAGE MODEL ASSIGNMENTS ─────────────────────────────────────────────
# Every stage here uses the SAME model (claude-opus-5-5) as the default.
# This establishes the 1.4.0 baseline for evaluation against 1.5.0.
#
# Stage-model rationale:
#   product-requirements → claude-sonnet-5-5
#     Requirements analysis is creative and structured. Sonnet provides the
#     best speed/intelligence balance — not every step needs maximum reasoning.
#
#   software-architecture → claude-opus-5-5
#     Architecture decisions require deep reasoning over service topology,
#     existing ADRs, compatibility constraints, and design trade-offs.
#     Opus handles long-horizon reasoning reliably at this stage.
#
#   software-engineering → claude-opus-5-5
#     Code generation + test writing in an isolated sandbox, working from
#     a detailed ADR and work items. Opus handles the full context window
#     and produces code that passes the verifier's oasdiff check.
#
#   security-compliance → claude-sonnet-5-5
#     Policy lookup, scanner result mapping, structured evidence output.
#     Sonnet is fast enough and correctly structured without Opus overhead.
#
#   platform-operations → claude-haiku-5-5
#     Health checks, deployment plans, incident diagnosis from logs.
#     Highly structured, latency-sensitive. Haiku is fast, cheap, and
#     perfectly suited for classification and extraction tasks.
stageModels:
  product-requirements: claude-sonnet-5-5
  software-architecture: claude-opus-5-5
  software-engineering: claude-opus-5-5
  security-compliance: claude-sonnet-5-5
  platform-operations: claude-haiku-5-5

components:
  skillsLock: factory-releases/skills.lock.json
  toolsLock: factory-releases/tools.lock.json
  sandboxLock: factory-releases/sandbox.lock.json
  workflowRef: "main"

acceptance:
  contract: factories/*/acceptance.yaml

evaluation:
  suite: evaluation/suite.yaml
  promotionPolicy: evaluation/policies/promotion.yaml

humanApprovalRequired:
  - stage: product-requirements
    condition: "constraints.requiresProductApproval == true"
  - stage: platform-operations
    condition: "deployment.environment == 'staging'"
