apiVersion: factory.contract/v1
kind: FactoryRelease

metadata:
  name: software-delivery
  version: "1.5.0"
  status: CANDIDATE
  createdAt: "2026-11-01T00:00:00Z"

runtime:
  engine: claude-agent-sdk
  # ───────────────────────────────────────────────────────────────────────────
  # DEFAULT MODEL for 1.5.0 candidate — same as 1.4.0 baseline.
  # The two key stages (software-architecture, software-engineering) are
  # upgraded to claude-fable-5-2 to test whether the more capable model
  # produces measurably better ADRs and code without introducing regressions.
  #
  # Evaluation hypothesis:
  #   "Does claude-fable-5-2 on the two most demanding stages produce
  #    higher-quality outputs than claude-opus-5-5 at acceptable cost?"
  #
  # Hard gate HG-001 blocks promotion if any breaking API change appears.
  # ───────────────────────────────────────────────────────────────────────────
  defaultModel: claude-opus-5-5
  sandbox:
    provider: opensandbox
    imageDigest: "sha256:REPLACE_WITH_ACTUAL_NODE22_IMAGE_DIGEST"
    resourceLimits:
      cpus: "2.0"
      memoryMb: 4096
      ttlSeconds: 3600
      networkEgress: restricted

productionLines:
  - product-requirements
  - software-architecture
  - software-engineering
  - security-compliance
  - platform-operations

# ─── PER-STAGE MODEL ASSIGNMENTS — 1.5.0 CANDIDATE ──────────────────────────
#
# Changes vs 1.4.0:
#
#   software-architecture: claude-opus-5-5 → claude-fable-5-2
#     Hypothesis: Fable's adaptive thinking and long-horizon reasoning
#     should produce more rigorous ADRs and OpenAPI specs that are
#     less likely to introduce compatibility issues downstream.
#     Cost increase: $8/MTok (Fable) vs $4/MTok (Opus) on this stage only.
#
#   software-engineering: claude-opus-5-5 → claude-fable-5-2
#     Hypothesis: Fable's agentic capabilities should handle the full
#     feature-implementation + test-driven-change skill sequence with
#     fewer iterations and produce code that passes the verifier first time.
#     This is the highest-value stage for the Fable upgrade.
#
# Unchanged stages (same as 1.4.0):
#   product-requirements: claude-sonnet-5-5 (speed/intelligence balance, unchanged)
#   security-compliance: claude-sonnet-5-5 (structured policy matching, unchanged)
#   platform-operations: claude-haiku-5-5 (fast structured output, unchanged)
#
# To promote this candidate:
#   1. pnpm factory evaluation:run --base 1.4.0 --candidate 1.5.0
#   2. pnpm factory evaluation:report --comparison <id>
#   3. pnpm factory promote --candidate 1.5.0 --decision <id>
# ─────────────────────────────────────────────────────────────────────────────
stageModels:
  product-requirements: claude-sonnet-5-5
  software-architecture: claude-fable-5-2    # ← UPGRADED from claude-opus-5-5
  software-engineering: claude-fable-5-2     # ← UPGRADED from claude-opus-5-5
  security-compliance: claude-sonnet-5-5
  platform-operations: claude-haiku-5-5

components:
  skillsLock: factory-releases/skills.lock.json
  toolsLock: factory-releases/tools.lock.json
  sandboxLock: factory-releases/sandbox.lock.json
  workflowRef: "main"

acceptance:
  contract: factories/*/acceptance.yaml

evaluation:
  suite: evaluation/suite.yaml
  promotionPolicy: evaluation/policies/promotion.yaml

humanApprovalRequired:
  - stage: product-requirements
    condition: "constraints.requiresProductApproval == true"
  - stage: platform-operations
    condition: "deployment.environment == 'staging'"

# CANDIDATE — do not promote without a PromotionDecision.
# Run: pnpm factory evaluation:run --base 1.4.0 --candidate 1.5.0
