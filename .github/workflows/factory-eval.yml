name: factory-eval

on:
  workflow_dispatch:
    inputs:
      baseVersion:
        description: 'Base factory release version'
        required: true
        default: '1.4.0'
      candidateVersion:
        description: 'Candidate factory release version'
        required: true
        default: '1.5.0'

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - name: Run evaluation
        env:
          PORT_CLIENT_ID: ${{ secrets.PORT_CLIENT_ID }}
          PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pnpm factory evaluation:run \
            --base "${{ inputs.baseVersion }}" \
            --candidate "${{ inputs.candidateVersion }}"
