name: factory-retry
# Triggered by Port self-service action "Resume Factory Run"
# Marks the run as PENDING in Port so the coordinator on Railway picks it up again.
# The coordinator is deployed on Railway — this workflow never runs the coordinator itself.

on:
  workflow_dispatch:
    inputs:
      runId:
        description: 'Factory Run ID to resume'
        required: true
        type: string
      portRunId:
        description: 'Port action run ID for status reporting'
        required: false
        type: string

permissions:
  contents: read

env:
  PORT_CLIENT_ID: ${{ secrets.PORT_CLIENT_ID }}
  PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}

jobs:
  resume-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Authenticate with Port
        id: port_auth
        run: |
          TOKEN=$(curl -sf -X POST "https://api.getport.io/v1/auth/access_token" \
            -H "Content-Type: application/json" \
            -d "{\"clientId\":\"$PORT_CLIENT_ID\",\"clientSecret\":\"$PORT_CLIENT_SECRET\"}" \
            | jq -r '.accessToken')
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Set run back to PENDING
        env:
          PORT_TOKEN: ${{ steps.port_auth.outputs.token }}
        run: |
          curl -sf -X PATCH \
            "https://api.getport.io/v1/blueprints/factoryRun/entities/${{ inputs.runId }}" \
            -H "Authorization: Bearer $PORT_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"properties": {"status": "PENDING"}}'
          echo "✓ Run ${{ inputs.runId }} set to PENDING — coordinator on Railway will pick it up within 10s"

      - name: Report to Port
        if: ${{ always() && inputs.portRunId != '' }}
        env:
          PORT_TOKEN: ${{ steps.port_auth.outputs.token }}
        run: |
          curl -sf -X PATCH "https://api.getport.io/v1/actions/runs/${{ inputs.portRunId }}" \
            -H "Authorization: Bearer $PORT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"SUCCESS\",\"summary\":\"Run ${{ inputs.runId }} queued for resume — coordinator will pick it up within 10s\"}"
