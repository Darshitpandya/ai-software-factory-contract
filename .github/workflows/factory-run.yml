name: factory-run
# Triggered by Port self-service actions on the workOrder and factoryRun blueprints.
#
# Actions handled:
#   run          — creates a PENDING factoryRun entity; coordinator on Railway picks it up
#   approve-stage — updates the factoryRun entity so the coordinator can advance
#
# The coordinator is deployed on Railway and polls Port every 10 seconds.
# This workflow never connects to PostgreSQL directly.

on:
  workflow_dispatch:
    inputs:
      workOrderId:
        description: 'Port WorkOrder entity identifier'
        required: true
        type: string
      releaseVersion:
        description: 'Factory release version (must match a factoryRelease entity)'
        required: false
        default: '1.4.0'
        type: string
      portRunId:
        description: 'Port action run ID — used to report SUCCESS back to Port'
        required: false
        type: string
      action:
        description: 'run | approve-stage'
        required: false
        default: 'run'
        type: choice
        options: [run, approve-stage]
      runId:
        description: 'Existing factory run ID (approve-stage only)'
        required: false
        type: string
      stage:
        description: 'Stage name to approve (approve-stage only)'
        required: false
        type: string
      decision:
        description: 'APPROVE or REJECT (approve-stage only)'
        required: false
        type: string

permissions:
  contents: read

env:
  PORT_CLIENT_ID: ${{ secrets.PORT_CLIENT_ID }}
  PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}

jobs:
  factory-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # ── Get a Port access token (used by all steps) ──────────────────────────
      - name: Authenticate with Port
        id: port_auth
        run: |
          TOKEN=$(curl -sf -X POST "https://api.getport.io/v1/auth/access_token" \
            -H "Content-Type: application/json" \
            -d "{\"clientId\":\"$PORT_CLIENT_ID\",\"clientSecret\":\"$PORT_CLIENT_SECRET\"}" \
            | jq -r '.accessToken')
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      # ── action: run ───────────────────────────────────────────────────────────
      # Creates a PENDING factoryRun entity in Port.
      # The coordinator on Railway detects it via syncPendingFromPort within 10 seconds
      # and processes all 5 factory stages autonomously.
      - name: Create factory run
        if: ${{ inputs.action == 'run' }}
        id: create_run
        env:
          PORT_TOKEN: ${{ steps.port_auth.outputs.token }}
        run: |
          RUN_ID=$(node -e "console.log(require('crypto').randomUUID())")
          echo "RUN_ID=$RUN_ID" >> $GITHUB_OUTPUT

          RESULT=$(curl -sf -X POST \
            "https://api.getport.io/v1/blueprints/factoryRun/entities?upsert=true&merge=true" \
            -H "Authorization: Bearer $PORT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"identifier\": \"$RUN_ID\",
              \"title\": \"Run ${RUN_ID:0:8} — ${{ inputs.workOrderId }}\",
              \"properties\": {
                \"runId\": \"$RUN_ID\",
                \"status\": \"PENDING\",
                \"currentStage\": \"product-requirements\",
                \"githubRunUrl\": \"https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\",
                \"attemptCount\": 0
              },
              \"relations\": {
                \"workOrder\": \"${{ inputs.workOrderId }}\",
                \"factoryRelease\": \"factory-release-${{ inputs.releaseVersion }}\"
              }
            }" | jq -r '.identifier')

          echo "✓ factoryRun created: $RESULT"
          echo "✓ Coordinator on Railway will pick it up within 10s"

      # ── action: approve-stage ─────────────────────────────────────────────────
      # Updates the factoryRun entity in Port.
      # The coordinator polls Port every 10s and reads this decision from Port properties.
      - name: Record stage approval
        if: ${{ inputs.action == 'approve-stage' }}
        env:
          PORT_TOKEN: ${{ steps.port_auth.outputs.token }}
        run: |
          curl -sf -X PATCH \
            "https://api.getport.io/v1/blueprints/factoryRun/entities/${{ inputs.runId }}" \
            -H "Authorization: Bearer $PORT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"properties\": {
                \"humanDecision\": \"${{ inputs.decision }}\",
                \"humanDecisionStage\": \"${{ inputs.stage }}\",
                \"humanDecisionBy\": \"port-action\"
              }
            }"
          echo "✓ Stage ${{ inputs.stage }} decision ${{ inputs.decision }} recorded on run ${{ inputs.runId }}"

      # ── Report result back to Port ────────────────────────────────────────────
      - name: Report to Port
        if: ${{ always() && inputs.portRunId != '' }}
        env:
          PORT_TOKEN: ${{ steps.port_auth.outputs.token }}
          RUN_ID: ${{ steps.create_run.outputs.RUN_ID }}
        run: |
          if [ -n "$RUN_ID" ]; then
            SUMMARY="Run $RUN_ID queued. Coordinator processing on Railway — view at https://app.getport.io/factoryRun/$RUN_ID"
          else
            SUMMARY="Action completed for run ${{ inputs.runId }}"
          fi

          curl -sf -X PATCH "https://api.getport.io/v1/actions/runs/${{ inputs.portRunId }}" \
            -H "Authorization: Bearer $PORT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"SUCCESS\",\"summary\":\"$SUMMARY\"}"
